# DynaNav benchmark episodes, adapted for AlohaMini.
#
# The scene/start/goal/instruction/timeout values are copied VERBATIM from
# TIC-VLA/DynaNav/configs/benchmark_full.yaml -- do not "improve" the prompts. The
# whole point of using a published benchmark is that the task is not one we invented
# to suit our robot, so the instructions must stay exactly as the authors wrote them.
# `robot_type` and the speed limits are ours, because AlohaMini is not a Nova Carter
# (see ../plan.md).
#
# ---------------------------------------------------------------------------------
# READ THIS BEFORE CHANGING A START POSE.
#
# These come from benchmark_full.yaml -- the 85-episode benchmark. They originally
# came from benchmark_example.yaml, which is a SMOKE/DEMO file, and three of its four
# episodes spawn the robot facing roughly 180 degrees AWAY from their own goal:
#
#     episode              start_yaw   goal bearing   off by
#     hospital_smoke            0.0         +15.5      +15.5   ok
#     office_smoke             90.0         -77.7     -167.7   facing away
#     outdoor_smoke          -123.0         +57.0     -180.0   facing away
#     warehouse_smoke        -141.0         +52.3     -166.7   facing away
#
# That is not a convention mismatch on our side. DynaNav applies start_yaw as a plain
# RotateZ on the robot prim (benchmark.py:_spawn_robot), which is exactly what
# sim/base_drive.py's reset_to() does, and across all 85 real episodes 54 start within
# 30 degrees of their goal bearing and NOT ONE is improved by a 180 degree flip. The
# smoke episodes are simply not aimed at anything.
#
# Running one of them looks exactly like a broken policy: the robot drives off in the
# wrong direction and never sees the landmark the instruction names, because the
# landmark is behind it. It cost a full debugging round here. Every episode below is
# annotated with how far off its own goal bearing it starts; keep that within ~30
# degrees, or the run is not testing navigation.
# ---------------------------------------------------------------------------------
#
# Ordering below is deliberate: `warehouse` is first because it is the default.
#
# Why warehouse and not office, even though office is DynaNav's showcase episode:
#   * office.usd DOES open in Isaac Sim 6.0.1 (Phase 8 verified it -- 4665 prims,
#     zero unresolved references), so this is not a compatibility dodge.
#   * But it measures 1063 m across and is the same NVIDIA Office asset that
#     ../../CLAUDE.md records as having caused a physics explosion at spawn and a
#     camera-framing bug in this exact repo.
#   * Simple_Warehouse is a real DynaNav benchmark episode AND is the environment
#     this repo already verified as physically stable with a true floor at Z=0.
# office is kept below and is fully runnable with `--episode office`; it is just not
# what we hand someone who wants to see this work the first time.

defaults:
  success_threshold_m: 1.5   # DynaNav's own criterion (benchmark_full.yaml)
  robot_type: "wheeled robot"  # goes into TIC-VLA's system prompt verbatim
  max_speed_mps: 0.6
  max_yaw_rate_radps: 1.2
  replan_every_steps: 30     # physics steps between policy calls (60 Hz -> 0.5 s)

episodes:

  # DynaNav episode_61. The Aisle 5 task, with the traffic cones the prompt names.
  warehouse:
    scene: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Simple_Warehouse/full_warehouse.usd"
    start: [-10.22, -7.36, 0.01]
    start_yaw_deg: 90
    goal: [-3.26, 7.61, 0.01]
    instruction: "Proceed to the traffic cones at the entrance of Aisle 05 (the second aisle from the right)."
    timeout_s: 70
    notes: "starts 24.9 deg off the goal bearing, 16.5 m out; NOT VERIFIED by DynaNav"
    # DynaNav's reference run on this machine (benchmark_results/20260813_090804)
    # scored 49 of the 85 episodes -- all hospital and office. It never ran a single
    # warehouse episode, so there is NO published result saying this task is solvable
    # by TIC-VLA. The only warehouse number that exists anywhere here is the SMOKE
    # episode, which DynaNav itself failed at 31.02 m. Do not treat a failure on this
    # episode as evidence of a bug in this repo until a verified episode passes.

  # DynaNav episode_76. The best-aimed warehouse episode in the whole benchmark, and a
  # much longer run -- useful for checking the robot still tracks an instruction after
  # it has had to commit to a turn.
  warehouse_aisle6:
    scene: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Simple_Warehouse/full_warehouse.usd"
    start: [-13.22, -6.36, 0.01]
    start_yaw_deg: 59
    goal: [1.82, 24.5, 0.01]
    instruction: "Go straight to enter Aisle 06 (the last aisle from the left), passing the yellow forklift to reach the end of the aisle."
    timeout_s: 250
    notes: "starts 5.0 deg off the goal bearing, 34.3 m out; NOT VERIFIED by DynaNav"

  # DynaNav episode_6 -- and DynaNav FAILED it: navigation_error 17.86 m, spl 0.00.
  # Kept because a known-failing episode is a useful negative control, but do not use
  # it to judge this repo. Note how little separates it from episode_7 below, which
  # DynaNav passes with spl 1.00: start x 19.7 vs 18.7, timeout 55 s vs 65 s.
  hospital_ep6_known_fail:
    scene: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Hospital/hospital.usd"
    start: [19.7, 29.3, 0.01]
    start_yaw_deg: -90
    goal: [16.1, -3.04, 0.01]
    instruction: "Walk straight down the hallway and stop at the red bed located to the right of the doors."
    timeout_s: 55
    notes: "starts 6.4 deg off bearing, 32.5 m out; DynaNav FAILS this one (17.86 m)"

  # ------------------------------------------------------------------------------
  # Below: episodes DynaNav's own reference run on this machine actually SUCCEEDED
  # on, taken from benchmark_results/20260813_090804 (29/49 = 59.2% overall;
  # hospital 19/25 = 76%, office 10/24 = 41.7%). All three below scored spl 1.00,
  # i.e. TIC-VLA drove them at essentially the optimal path length.
  #
  # These are the episodes to judge this integration by. If one of them fails here,
  # the difference is ours and is worth chasing. Every success in the reference run
  # records navigation_error ~1.49 m because the episode TERMINATES at the 1.5 m
  # threshold -- rank candidates by spl and path length, not by final error.
  # ------------------------------------------------------------------------------

  # DynaNav episode_3. Shortest and simplest verified success in the benchmark:
  # 13 m, no turn required, spl 1.00. This is the one to run first.
  hospital_vending:
    scene: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Hospital/hospital.usd"
    start: [-3.0, -1.2, 0.01]
    start_yaw_deg: 0
    goal: [9.52, 2.33, 0.01]
    instruction: "Go straight ahead and stop at the front of the vending machine at front left."
    timeout_s: 60
    notes: "DynaNav: SUCCESS spl 1.00, path 12.1 m; starts 15.7 deg off bearing, 13.0 m out"

  # DynaNav episode_7. Same instruction as episode_6 above, one metre of start offset
  # and 10 s more budget -- and it passes with spl 1.00 where episode_6 fails outright.
  hospital_redbed:
    scene: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Hospital/hospital.usd"
    start: [18.7, 29.3, 0.01]
    start_yaw_deg: -90
    goal: [16.1, -3.04, 0.01]
    instruction: "Walk straight down the hallway and stop at the red bed located to the right of the doors."
    timeout_s: 65
    notes: "DynaNav: SUCCESS spl 1.00, path 31.4 m; starts 4.6 deg off bearing, 32.4 m out"

  # DynaNav episode_39. The important one: its instruction contains an explicit TURN
  # ("then turn left at the end") and DynaNav still scores spl 1.00 over 13.2 m. If
  # the warehouse Aisle-05 failure really is "this policy will not commit to a turn",
  # this episode is where that claim gets tested against a verified success.
  office_emergency_exit:
    scene: "${TICVLA_DYNANAV_ROOT}/assets/office.usd"
    start: [-10.6, -12.1, 0.01]
    start_yaw_deg: -90
    goal: [-7.68, -25.53, 0.01]
    instruction: "Go straight ahead through the hallway, then turn left at the end to approach the red emergency exit door."
    timeout_s: 110
    notes: "DynaNav: SUCCESS spl 1.00, path 13.2 m; starts 12.3 deg off bearing, 13.7 m out"

  # DynaNav episode_26.
  office:
    scene: "${TICVLA_DYNANAV_ROOT}/assets/office.usd"
    start: [-2.85, 9.6, 0.01]
    start_yaw_deg: -132
    goal: [-13.4, -1.2, 0.01]
    instruction: "Go straight ahead and stop at the nearest elevator."
    timeout_s: 50
    # See the header note. Phase 8 measured this stage at 1063.55 x 677.15 m.
    notes: "starts 2.3 deg off the goal bearing, 15.1 m out; 1 km stage, do NOT spawn at origin"

  # DynaNav episode_51.
  outdoor:
    scene: "${TICVLA_DYNANAV_ROOT}/assets/outdoor_small.usd"
    start: [26.9, 148.8, 6.85]
    start_yaw_deg: 160
    goal: [9.39, 154.52, 5.97]
    instruction: "Go straight until reach the black and white striped umbrellas."
    timeout_s: 100
    # Note the Z: this terrain is elevated ~6 m. Spawning at z=0.01 drops the robot
    # through the world.
    notes: "starts 1.9 deg off the goal bearing, 18.4 m out"

# Deliberately NOT replicated from DynaNav: `num_people`.
# DynaNav spawns animated pedestrians as dynamic obstacles. AlohaMini's base is
# kinematically teleported (../../CLAUDE.md: real wheel traction never held up, so
# locomotion is set_world_poses() rather than physics-driven), which means it has NO
# collision response -- it would walk straight through a pedestrian without either
# body reacting. Spawning people would therefore make the demo look like it handles
# dynamic obstacles when it provably does not. sim/collision_guard.py raycasts
# instead, which is honest about being a guard rather than real contact physics.
# The episodes chosen above are the num_people: 0 variants wherever one exists.
